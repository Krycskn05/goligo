# LernKoko kurulum kontrolü: adımlar ci/kurulum.sh içinde. Yayın yapmaz.
name: Kurulum kontrolu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kurulum:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bash ci/kurulum.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
