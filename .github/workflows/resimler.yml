# Nesne Kasası resimlerini art/werkzeug içindeki 3D modellerden çizer ve
# public/objects/toon/tools-*.webp (aletler) ile 3d-*.webp (diğer nesneler) olarak depoya kaydeder.
# Sonra testleri (ardından yayını) ve site seslerini başlatır.
name: Resimler
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: resimler
  cancel-in-progress: false
jobs:
  resimler:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Playwright kurulumu
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Resimleri ciz
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright" node art/werkzeug/render.cjs public/objects/toon
      - name: Kaydet, testleri ve sesleri baslat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/objects/toon/tools-*.webp public/objects/toon/3d-*.webp
          if git diff --cached --quiet; then
            echo "Resimler degismedi."
          else
            git commit -qm "Nesne Kasasi resimleri [skip ci]"
            git push -q origin HEAD:main
          fi
          gh workflow run sesler.yml --ref main -R "$GITHUB_REPOSITORY"
          gh workflow run kurulum.yml --ref main -R "$GITHUB_REPOSITORY"
