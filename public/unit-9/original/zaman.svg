<svg xmlns="http://www.w3.org/2000/svg" width="900" height="558" viewBox="0 0 900 558" role="img" aria-labelledby="title desc"><title id="title">Wann?</title><desc id="desc">Zeitwörter in kurzen Beispielen; am — am Montag; um — um 10 Uhr; von … bis … — von 8 bis 17 Uhr; ab — ab 14 Uhr; bis — bis 18 Uhr; zwischen … und … — zwischen 12 und 14 Uhr</desc><rect width="900" height="558" rx="28" fill="#faf8f4"/><rect x="24" y="24" width="852" height="510" rx="22" fill="white" stroke="#d9dfeb"/><rect x="24" y="24" width="10" height="510" rx="5" fill="#18756a"/><text x="60" y="76" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#18233c">Wann?</text><text x="60" y="112" font-family="Arial,sans-serif" font-size="19" fill="#53617b">Zeitwörter in kurzen Beispielen</text><rect x="50" y="145" width="800" height="59" rx="10" fill="#f1f0fa"/><text x="66" y="180" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18756a">am</text><text x="451" y="180" font-family="Arial,sans-serif" font-size="24" font-weight="500" fill="#18233c">am Montag</text><rect x="50" y="213" width="800" height="59" rx="10" fill="#ffffff"/><text x="66" y="248" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18756a">um</text><text x="451" y="248" font-family="Arial,sans-serif" font-size="24" font-weight="500" fill="#18233c">um 10 Uhr</text><rect x="50" y="281" width="800" height="59" rx="10" fill="#f1f0fa"/><text x="66" y="316" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18756a">von … bis …</text><text x="451" y="316" font-family="Arial,sans-serif" font-size="24" font-weight="500" fill="#18233c">von 8 bis 17 Uhr</text><rect x="50" y="349" width="800" height="59" rx="10" fill="#ffffff"/><text x="66" y="384" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18756a">ab</text><text x="451" y="384" font-family="Arial,sans-serif" font-size="24" font-weight="500" fill="#18233c">ab 14 Uhr</text><rect x="50" y="417" width="800" height="59" rx="10" fill="#f1f0fa"/><text x="66" y="452" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18756a">bis</text><text x="451" y="452" font-family="Arial,sans-serif" font-size="24" font-weight="500" fill="#18233c">bis 18 Uhr</text><rect x="50" y="485" width="800" height="59" rx="10" fill="#ffffff"/><text x="66" y="520" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18756a">zwischen … und …</text><text x="451" y="520" font-family="Arial,sans-serif" font-size="24" font-weight="500" fill="#18233c">zwischen 12 und 14 Uhr</text></svg>