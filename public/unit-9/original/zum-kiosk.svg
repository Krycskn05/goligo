<svg xmlns="http://www.w3.org/2000/svg" width="900" height="354" viewBox="0 0 900 354" role="img" aria-labelledby="title desc"><title id="title">Wohin?</title><desc id="desc">zu + Dativ; zu dem — zum; zu der — zur; Ich gehe — zum Kiosk.</desc><rect width="900" height="354" rx="28" fill="#faf8f4"/><rect x="24" y="24" width="852" height="306" rx="22" fill="white" stroke="#d9dfeb"/><rect x="24" y="24" width="10" height="306" rx="5" fill="#18756a"/><text x="60" y="76" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#18233c">Wohin?</text><text x="60" y="112" font-family="Arial,sans-serif" font-size="19" fill="#53617b">zu + Dativ</text><rect x="50" y="145" width="800" height="59" rx="10" fill="#f1f0fa"/><text x="66" y="180" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18756a">zu dem</text><text x="451" y="180" font-family="Arial,sans-serif" font-size="24" font-weight="500" fill="#18233c">zum</text><rect x="50" y="213" width="800" height="59" rx="10" fill="#ffffff"/><text x="66" y="248" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18756a">zu der</text><text x="451" y="248" font-family="Arial,sans-serif" font-size="24" font-weight="500" fill="#18233c">zur</text><rect x="50" y="281" width="800" height="59" rx="10" fill="#f1f0fa"/><text x="66" y="316" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18756a">Ich gehe</text><text x="451" y="316" font-family="Arial,sans-serif" font-size="24" font-weight="500" fill="#18233c">zum Kiosk.</text></svg>